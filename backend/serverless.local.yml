service: planilha-organizacao-api

frameworkVersion: '4'

provider:
   name: aws
   runtime: nodejs18.x
   stage: ${opt:stage, 'dev'}
   region: sa-east-1
   memorySize: 512
   timeout: 30
   environment:
      NODE_ENV: ${self:provider.stage}
      DATABASE_URL: ${env:DATABASE_URL, 'file:./dev.db'}
      JWT_SECRET: ${env:JWT_SECRET, 'sua-chave-secreta-super-segura-2025'}
      JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '7d'}
      FRONTEND_URL: ${env:FRONTEND_URL, 'http://localhost:4200'}

functions:
   api:
      handler: dist/lambda.handler
      events:
         - http:
              path: /{proxy+}
              method: ANY
              cors:
                 origin: ${env:FRONTEND_URL, '*'}
                 headers:
                    - Content-Type
                    - X-Amz-Date
                    - Authorization
                    - X-Api-Key
                    - X-Amz-Security-Token
                    - X-Amz-User-Agent
                 allowCredentials: true
         - http:
              path: /
              method: ANY
              cors:
                 origin: ${env:FRONTEND_URL, '*'}
                 headers:
                    - Content-Type
                    - X-Amz-Date
                    - Authorization
                    - X-Api-Key
                    - X-Amz-Security-Token
                    - X-Amz-User-Agent
                 allowCredentials: true

plugins:
   - serverless-offline

custom:
   serverless-offline:
      httpPort: 3000
      host: 0.0.0.0

package:
   patterns:
      - '!node_modules/.cache/**'
      - '!node_modules/@prisma/engines/**'
      - '!node_modules/.prisma/**'
      - '!prisma/migrations/**'
      - '!*.md'
      - '!*.log'
      - '!.env*'
      - '!config.env'
      - '!docker-compose.yml'
      - '!Dockerfile'
