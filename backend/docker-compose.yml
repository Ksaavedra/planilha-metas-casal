version: '3.8'

services:
   postgres:
      image: postgres:15-alpine
      container_name: planilha_postgres
      environment:
         POSTGRES_DB: planilha_organizacao_dev
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: password
      ports:
         - '5432:5432'
      volumes:
         - postgres_data:/var/lib/postgresql/data
      restart: unless-stopped

   adminer:
      image: adminer:4.8.1
      container_name: planilha_adminer
      ports:
         - '8080:8080'
      depends_on:
         - postgres
      restart: unless-stopped

volumes:
   postgres_data:
