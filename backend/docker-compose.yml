version: '3.8'

services:
   mysql:
      image: mysql:8.0
      container_name: planilha_mysql
      environment:
         MYSQL_DATABASE: planilha_organizacao_dev
         MYSQL_ROOT_PASSWORD: password
         MYSQL_USER: dev
         MYSQL_PASSWORD: password
      ports:
         - '3306:3306'
      volumes:
         - mysql_data:/var/lib/mysql
      restart: unless-stopped
      command: --default-authentication-plugin=mysql_native_password

   adminer:
      image: adminer:4.8.1
      container_name: planilha_adminer
      ports:
         - '8080:8080'
      depends_on:
         - mysql
      restart: unless-stopped

volumes:
   mysql_data:
