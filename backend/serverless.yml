service: planilha-organizacao-api

frameworkVersion: '4'

provider:
   name: aws
   runtime: nodejs18.x
   stage: ${opt:stage, 'dev'}
   region: sa-east-1
   memorySize: 512
   timeout: 30
   environment:
      NODE_ENV: ${self:provider.stage}
      DATABASE_URL: ${env:DATABASE_URL}
      JWT_SECRET: ${env:JWT_SECRET}
      JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN, '7d'}
      FRONTEND_URL: ${env:FRONTEND_URL, 'https://your-frontend-domain.com'}
   iamRoleStatements:
      - Effect: Allow
        Action:
           - rds:DescribeDBInstances
           - rds:Connect
        Resource: '*'
   vpc:
      securityGroupIds:
         - ${env:LAMBDA_SECURITY_GROUP_ID}
      subnetIds:
         - ${env:LAMBDA_SUBNET_ID_1}
         - ${env:LAMBDA_SUBNET_ID_2}

functions:
   api:
      handler: dist/src/lambda-simple.handler
      layers:
         - arn:aws:lambda:sa-east-1:365309361668:layer:prisma-client-layer:1
      events:
         - http:
              path: /{proxy+}
              method: ANY
              cors:
                 origin: ${env:FRONTEND_URL, '*'}
                 headers:
                    - Content-Type
                    - X-Amz-Date
                    - Authorization
                    - X-Api-Key
                    - X-Amz-Security-Token
                    - X-Amz-User-Agent
                 allowCredentials: true
         - http:
              path: /
              method: ANY
              cors:
                 origin: ${env:FRONTEND_URL, '*'}
                 headers:
                    - Content-Type
                    - X-Amz-Date
                    - Authorization
                    - X-Api-Key
                    - X-Amz-Security-Token
                    - X-Amz-User-Agent
                 allowCredentials: true

layers:
   PrismaClientLayer:
      path: prisma-layer
      name: prisma-client-layer
      description: Prisma Client Layer for Planilha Organizacao
      compatibleRuntimes:
         - nodejs18.x

plugins:
   - serverless-offline

custom:
   serverless-offline:
      httpPort: 3000
      host: 0.0.0.0
   esbuild:
      bundle: true
      minify: true
      sourcemap: false
      external:
         - 'aws-sdk'
      packager: npm
      installExtraArgs:
         - '--production'

package:
   patterns:
      - '!node_modules/**'
      - '!prisma/**'
      - '!*.md'
      - '!*.log'
      - '!.env*'
      - '!config.env'
      - '!docker-compose.yml'
      - '!Dockerfile'
      - '!scripts/**'
      - '!*.ps1'
      - '!*.sh'
      - '!src/**'
      - '!tsconfig.json'
      - '!webpack.config.js'
      - '!*.test.ts'
      - '!*.spec.ts'
      - '!prisma-layer/**'
      - '!prisma-layer.zip'
      - '!layer-arn.txt'
