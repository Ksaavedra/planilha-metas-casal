<h2 mat-dialog-title>{{ titulo }}</h2>

<mat-dialog-content class="inv-dialog__content">
  <form [formGroup]="form" class="inv-dialog__form">
    <label class="inv-dialog__field">
      <span>Objetivo</span>
      <input type="text" formControlName="descricao" placeholder="Ex.: Reserva de emergência" />
    </label>

    <label class="inv-dialog__field">
      <span>Tipo de investimento</span>
      <select formControlName="tipoInvestimento">
        <option value="" disabled>Selecione</option>
        <option *ngFor="let t of tipos" [value]="t.value">{{ t.label }}</option>
      </select>
    </label>

    <div class="inv-dialog__row">
      <label class="inv-dialog__field">
        <span>Valor investido (R$)</span>
        <input type="number" formControlName="valorInvestido" min="0" step="0.01" />
      </label>
      <label class="inv-dialog__field">
        <span>Patrimônio atual (R$)</span>
        <input type="number" formControlName="valorAtual" min="0" step="0.01" />
      </label>
    </div>

    <label class="inv-dialog__field">
      <span>Aporte mensal (R$)</span>
      <input type="number" formControlName="aporteMensal" min="0" step="0.01" />
    </label>

    <label class="inv-dialog__field">
      <span>Status</span>
      <select formControlName="statusInvestimento">
        <option *ngFor="let s of statusOpcoes" [value]="s.value">{{ s.label }}</option>
      </select>
    </label>

    <label class="inv-dialog__field">
      <span>Instituição (opcional)</span>
      <input type="text" formControlName="instituicao" />
    </label>

    <label class="inv-dialog__field">
      <span>Data de início (opcional)</span>
      <input type="date" formControlName="dataInicio" />
    </label>

    <label class="inv-dialog__field">
      <span>Observações</span>
      <textarea formControlName="observacoes" rows="2"></textarea>
    </label>

    <p class="inv-dialog__erro" *ngIf="erro">{{ erro }}</p>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-button (click)="cancelar()" [disabled]="saving">Cancelar</button>
  <button type="button" mat-flat-button color="primary" (click)="salvar()" [disabled]="saving">
    {{ saving ? 'Salvando…' : 'Salvar' }}
  </button>
</mat-dialog-actions>
