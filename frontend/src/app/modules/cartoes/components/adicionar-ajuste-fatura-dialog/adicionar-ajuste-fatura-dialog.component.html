<div class="adicionar-ajuste-fatura-dialog">
  <h2 mat-dialog-title class="dialog-titulo">
    <span class="material-icons dialog-titulo-icone" aria-hidden="true">tune</span>
    {{ editando ? 'Editar ajuste' : 'Juros / crédito / ajuste' }}
  </h2>

  <mat-dialog-content class="dialog-body">
    <form
      id="form-ajuste-fatura-dialog"
      [formGroup]="form"
      (ngSubmit)="salvar()"
      class="ajuste-form"
      novalidate
    >
      <p class="ajuste-contexto">
        Cartão: <strong>{{ data.cartao.nome }}</strong> · {{ data.cartao.banco }} ·
        Fatura de {{ data.mes }}/{{ data.ano }}
      </p>

      <div class="form-grid">
        <label class="field field-wide">
          <span class="field-label">Tipo de lançamento</span>
          <select formControlName="categoria" class="input-text">
            <option *ngFor="let cat of categorias" [value]="cat.id">
              {{ cat.label }}
            </option>
          </select>
          <small class="field-help">
            Créditos e estornos reduzem a fatura; juros e encargos aumentam.
          </small>
        </label>

        <label class="field">
          <span class="field-label">Valor (R$)</span>
          <input
            type="number"
            formControlName="valor"
            class="input-text"
            min="0.01"
            step="0.01"
            placeholder="Ex.: 130,00"
          />
          <small class="field-help">Informe sempre o valor positivo.</small>
        </label>

        <div class="field field-wide ajuste-preview" *ngIf="valorAssinadoPreview !== 0" role="status">
          <span class="material-icons ajuste-preview__icon" aria-hidden="true">calculate</span>
          <span>
            Impacto na fatura:
            <strong>{{ valorAssinadoPreview | currency:'BRL' }}</strong>
          </span>
        </div>

        <label class="field field-wide">
          <span class="field-label">Observações (opcional)</span>
          <textarea
            formControlName="observacoes"
            class="input-text input-textarea"
            rows="2"
            placeholder="Ex.: crédito da fatura de janeiro conforme app do banco"
          ></textarea>
        </label>
      </div>

      <p class="erro-form" *ngIf="erro" role="alert">{{ erro }}</p>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-acoes">
    <button
      *ngIf="editando"
      type="button"
      mat-stroked-button
      color="warn"
      class="dialog-acoes__excluir"
      [disabled]="saving"
      (click)="excluir()"
    >
      Excluir
    </button>
    <span class="dialog-acoes__spacer"></span>
    <button type="button" mat-stroked-button (click)="fechar()">Cancelar</button>
    <button
      type="submit"
      mat-flat-button
      color="primary"
      form="form-ajuste-fatura-dialog"
      [disabled]="saving || form.invalid"
    >
      <span *ngIf="!saving">{{ editando ? 'Atualizar' : 'Adicionar' }}</span>
      <span *ngIf="saving">Salvando...</span>
    </button>
  </mat-dialog-actions>
</div>
