<h2 mat-dialog-title class="dialog-titulo">
  <span class="material-icons dialog-titulo-icone" aria-hidden="true">add_chart</span>
  {{ tituloDialog }}
</h2>

<mat-dialog-content class="dialog-body">
  <div class="dicas-bloco">
    <h3 class="dicas-titulo">Exemplos</h3>
    <ul class="dicas-lista">
      <li *ngFor="let ex of exemplos">{{ ex }}</li>
    </ul>
    <p class="dica-separar">
      <span class="material-icons dica-icone" aria-hidden="true">info</span>
      Separe <strong>despesas fixas</strong> (todo mês parecido) de
      <strong>despesas variáveis</strong> (que mudam).
    </p>
  </div>

  <form
    id="form-despesa-dialog"
    [formGroup]="form"
    (ngSubmit)="salvar()"
    class="despesas-form"
    novalidate
  >
    <div class="form-grid">
      <label class="field">
        <span class="field-label">Tipo</span>
        <select formControlName="natureza" class="input-select">
          <option value="fixa">Fixa (recorrente)</option>
          <option value="variavel">Variável</option>
        </select>
      </label>
      <label class="field">
        <span class="field-label">Categoria</span>
        <select formControlName="categoria" class="input-select">
          <option value="" disabled>Selecione…</option>
          <option *ngFor="let c of categorias" [value]="c">{{ c }}</option>
        </select>
      </label>
      <label class="field field-wide">
        <span class="field-label">Descrição</span>
        <input
          type="text"
          formControlName="descricao"
          class="input-text"
          placeholder="Ex.: Condomínio, supermercado…"
          autocomplete="off"
        />
      </label>
      <label class="field">
        <span class="field-label">Valor (R$)</span>
        <input
          type="number"
          formControlName="valor"
          class="input-text"
          min="0.01"
          step="0.01"
        />
      </label>
      <label class="field">
        <span class="field-label">Data</span>
        <input type="date" formControlName="data" class="input-text" />
      </label>
    </div>
    <p class="erro-form" *ngIf="erro" role="alert">{{ erro }}</p>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-acoes">
  <button type="button" mat-stroked-button (click)="fechar()">Cancelar</button>
  <button
    type="submit"
    mat-flat-button
    color="primary"
    form="form-despesa-dialog"
    [disabled]="saving || form.invalid"
  >
    <span *ngIf="!saving">{{ isEdicao ? 'Atualizar' : 'Adicionar' }}</span>
    <span *ngIf="saving">Salvando…</span>
  </button>
</mat-dialog-actions>
