<div class="relatorio-graficos">
  <div *ngIf="exibirAvisoRelatorioVazio" class="relatorio-graficos__empty" role="status" aria-live="polite">
    <p class="relatorio-graficos__empty-text">Nenhum dado encontrado para este período.</p>
    <button type="button" class="relatorio-graficos__empty-btn" (click)="voltarAoAnoAtual()">
      Voltar para o ano atual
    </button>
  </div>

  <div *ngIf="!exibirAvisoRelatorioVazio" class="charts-grid">
    <section class="chart-section">
      <h2 class="chart-title">Comparação de anos</h2>
      <div #chartSaldo class="demo-chart"></div>
    </section>

    <section class="chart-section">
      <h2 class="chart-title">Receitas x Despesas</h2>
      <div #chartReceitasDespesas class="demo-chart"></div>
    </section>

    <section class="chart-section">
      <h2 class="chart-title">Receitas fixas e variáveis</h2>
      <div #chartReceitasFixasVariaveis class="demo-chart"></div>
    </section>

    <section class="chart-section">
      <h2 class="chart-title">Despesas por categoria</h2>
      <div #chartDespesasCategoria class="demo-chart"></div>
    </section>

    <section class="chart-section">
      <h2 class="chart-title">Faturas</h2>
      <div #chartFaturas class="demo-chart"></div>
    </section>

    <section class="chart-section">
      <h2 class="chart-title">Investimentos</h2>
      <div #chartInvestimentos class="demo-chart"></div>
    </section>

    <section class="chart-section">
      <h2 class="chart-title">Dívidas: Pago x Restante</h2>
      <div #chartDividas class="demo-chart"></div>
    </section>
  </div>
</div>
