<div class="progress-section" *ngIf="metasValidas.length > 0">
  <div class="section-header">
    <h2>EVOLUÇÃO DAS METAS DO CASAL</h2>
  </div>
  <div class="carousel-container">
    <div class="carousel-wrapper" #wrapper [class.has-carousel]="metasValidas.length > 6 && metasValidas.length <= 15">
      <div class="carousel-content" #content [style.transform]="getTranslateX()"
        [style.transition]="'transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)'">
        <!-- Cards reais - apenas metas válidas -->
        <div class="meta-card" *ngFor="let meta of metasValidas; let i = index" (mouseenter)="pauseCarousel()"
          (mouseleave)="resumeCarousel()">
          <div class="card-cover">
            <div class="cover-gradient" [style.background]="getGradientColor(i)"></div>
            <div class="cover-content">
              <div class="meta-icon"><i [class]="'bi ' + getMetaIcon(meta)"></i></div>
            </div>
          </div>
          <div class="card-body">
            <div class="meta-name">{{ meta.nome }}</div>
            <div class="progress-info">
              <div class="progress-percentage">{{ getProgressoRealMeta(meta) | number:'1.1-1' }}%</div>
              <div class="progress-bar">
                <div class="progress-fill" [style.width.%]="getProgressoRealMeta(meta)"></div>
              </div>
            </div>
            <div class="meta-details">
              <div class="detail-item">
                <span class="label">Meta:</span>
                <span class="value">{{ meta.valorMeta | currency:'BRL' }}</span>
              </div>
              <div class="detail-item">
                <span class="label">Atual:</span>
                <span class="value">{{ getValorRealizadoMeta(meta) | currency:'BRL' }}</span>
              </div>
              <div class="detail-item">
                <span class="label">
                  <ng-container *ngIf="getValorFaltanteMeta(meta) === 0; else faltaLabel">
                    Status:
                  </ng-container>
                  <ng-template #faltaLabel>Falta:</ng-template>
                </span>
                <span class="value" [class.concluido]="getValorFaltanteMeta(meta) === 0">
                  <ng-container *ngIf="getValorFaltanteMeta(meta) === 0; else faltaTemplate">
                    Concluído 🎉
                  </ng-container>
                  <ng-template #faltaTemplate>
                    {{ getValorFaltanteMeta(meta) | currency:'BRL' }}
                  </ng-template>
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Cards placeholder cinzas -->
        <div class="meta-card placeholder-card" *ngFor="let _ of getPlaceholderCards()">
          <div class="card-cover placeholder-cover">
            <div class="cover-gradient placeholder-gradient"></div>
            <div class="cover-content">
              <div class="meta-icon placeholder-icon"><i class="bi bi-bullseye"></i></div>
            </div>
          </div>
          <div class="card-body placeholder-body">
            <div class="meta-name placeholder-name"></div>
            <div class="progress-info">
              <div class="progress-percentage placeholder-percentage"></div>
              <div class="progress-bar placeholder-progress-bar"></div>
            </div>
            <div class="meta-details">
              <div class="detail-item placeholder-detail"></div>
              <div class="detail-item placeholder-detail"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Controles de navegação -->
      <div class="carousel-controls" *ngIf="metasValidas.length > 6 && metasValidas.length <= 15">
        <button class="control-btn prev" (click)="prevSlide()" [disabled]="currentIndex === 0">
          <span class="material-icons">chevron_left</span>
        </button>
        <button class="control-btn next" (click)="nextSlide()" [disabled]="isLastSlide()">
          <span class="material-icons">chevron_right</span>
        </button>
      </div>
    </div>
  </div>
</div>
