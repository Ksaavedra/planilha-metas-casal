<div class="section-execucao">
  <div class="section-header">
    <h2>EXECUTANDO AS METAS DO CASAL</h2>
  </div>
  <div class="table-container">
    <table class="execucao-table">
      <thead>
        <tr>
          <th>QUAL É A META?</th>
          <th *ngFor="let mes of meses">{{ mes }}</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let meta of metas; trackBy: trackByMetaId; let i = index;" [class.alternate]="i % 2 === 1">
          <td>{{ meta.nome }}</td>
          <td *ngFor="let mes of meta.meses; trackBy: trackByMesId;" class="status-cell" [attr.data-meta-id]="meta.id"
            [attr.data-mes-id]="mes.id">
            <div class="status-dropdown-container"
              style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 0.1rem;">
              <span class="valor-display" (click)="abrirModalEdicao(meta, mes.id)"
                [class.valor-programado]="mes.status === 'Programado'" [class.valor-pago]="mes.status === 'Pago'"
                [class.valor-vazio]="mes.status === 'Vazio'" title="Clique para editar o valor"
                style="display: inline-flex; align-items: center; margin: 0; padding-right: 0.15rem;">
                {{ formatBR(mes.valor) }}
              </span>
              <div class="status-indicator-wrapper" style="display: inline-flex; margin: 0;">
                <div class="status-indicator" (click)="toggleDropdown(meta, mes.id, $event)"
                  [class.status-programado]="mes.status === 'Programado'" [class.status-pago]="mes.status === 'Pago'"
                  [class.status-vazio]="mes.status === 'Vazio'" title="Clique na seta para alterar o status">
                  <span class="material-icons">expand_more</span>
                </div>
              </div>
            </div>
          </td>
          <td><strong>{{ getTotalContribuicoesMetaExtended(meta) | currency:'BRL' }}</strong></td>
        </tr>
        <tr class="total-row">
          <td><strong>Total</strong></td>
          <td *ngFor="let total of totalContribuicoesPorMes">
            <strong>{{ total | currency:'BRL' }}</strong>
          </td>
          <td><strong>{{ totalContribuicoesView | currency:'BRL' }}</strong></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Dropdown agora é renderizado diretamente no body via Renderer2 -->
</div>
