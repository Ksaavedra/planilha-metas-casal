<main class="auth-page">
  <section class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand__top">
        <div class="title-brand">
          <div class="title-brand__name">
            <span class="auth-brand__icon" aria-hidden="true">
              <img src="/assets/images/logo-roxo.png" alt="" />
            </span>
            <strong>ORBIS</strong>
          </div>
          <p>Planejamento Financeiro</p>
        </div>
      </div>
      <h1>Recuperar senha</h1>
      <span>Informe o email da sua conta para receber um código de verificação.</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="enviar()" class="auth-form">
      <label>
        <span>Email</span>
        <input
          type="email"
          formControlName="email"
          placeholder="voce@email.com"
          autocomplete="email"
        />
        <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Informe um email válido.
        </small>
      </label>

      <div class="auth-alert auth-alert--success" *ngIf="sucesso">
        {{ sucesso }}
      </div>

      <div class="auth-alert" *ngIf="erro">
        {{ erro }}
      </div>

      <button type="submit" [disabled]="carregando">
        {{ carregando ? 'Enviando...' : 'Enviar código' }}
      </button>
    </form>

    <p class="auth-footer">
      Lembrou sua senha?
      <a routerLink="/login">Voltar para entrar</a>
    </p>
  </section>
</main>
