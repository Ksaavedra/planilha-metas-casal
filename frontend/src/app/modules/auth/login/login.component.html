<main class="auth-page">
  <section class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand__top">
        <div class="title-brand">
          <div class="title-brand__name">
            <span class="auth-brand__icon" aria-hidden="true">
              <img src="/assets/images/logo-roxo.png" alt="" />
            </span>
            <strong>ORBIS</strong>
          </div>
          <p>Planejamento Financeiro</p>
        </div>
      </div>
      <h1>{{ modoRecuperacao ? 'Recuperar senha' : 'Entrar' }}</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="modoRecuperacao ? recuperarSenha() : entrar()" class="auth-form">
      <label>
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="voce@email.com" autocomplete="email" />
        <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Informe um email válido.
        </small>
      </label>

      <label *ngIf="!modoRecuperacao">
        <span>Senha</span>
        <div class="password-field">
          <input [type]="mostrarSenha ? 'text' : 'password'" formControlName="senha" placeholder="Sua senha"
            autocomplete="current-password" />
          <button type="button" class="password-toggle" (click)="mostrarSenha = !mostrarSenha"
            [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">
            <span class="material-icons" aria-hidden="true">
              {{ mostrarSenha ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
        <small *ngIf="form.get('senha')?.touched && form.get('senha')?.invalid">
          A senha é obrigatória.
        </small>
      </label>

      <button type="button" class="auth-forgot" *ngIf="!modoRecuperacao" (click)="iniciarRecuperacao()">
        Esqueceu sua senha?
      </button>

      <div class="auth-alert auth-alert--success" *ngIf="sucesso">
        {{ sucesso }}
      </div>

      <div class="auth-alert" *ngIf="erro">
        {{ erro }}
      </div>

      <button type="submit" [disabled]="carregando">
        {{ modoRecuperacao ? 'Enviar' : (carregando ? 'Entrando...' : 'Entrar') }}
      </button>
    </form>

    <p class="auth-footer" *ngIf="!modoRecuperacao">
      Ainda não tem conta?
      <a routerLink="/register">Criar conta</a>
    </p>

    <p class="auth-footer" *ngIf="modoRecuperacao">
      Lembrou sua senha?
      <button type="button" (click)="voltarParaLogin()">Voltar para entrar</button>
    </p>
  </section>
</main>
