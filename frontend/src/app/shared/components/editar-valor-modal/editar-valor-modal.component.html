<div class="modal-overlay" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="modal-content" (click)="stop($event)">
    <div class="modal-header">
      <h3>Editar Valor</h3>
      <button class="modal-close" (click)="handleClose()">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="modal-body">
      <div class="modal-info">
        <p><strong>Meta:</strong> {{ meta?.nome }}</p>
        <p><strong>Mês:</strong> {{ mesNome }}</p>
      </div>

      <div class="modal-input-group">
        <label for="valor-input">Valor:</label>
        <div class="input-with-prefix">
          <input id="valor-input" type="text" inputmode="decimal" [ngModel]="valorInput"
            (ngModelChange)="onValorChange($event)" (keydown.enter)="onSave()" (blur)="onValorBlur()"
            (keypress)="validarApenasNumeros($event)" class="modal-input" placeholder="0,00" autofocus>
        </div>
      </div>

      <div class="modal-input-group">
        <label>Resultado:</label>
        <div class="resultado-formatado">
          <span class="valor-formatado">{{ formatarMoeda(valor) }}</span>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" (click)="onCancel()">
        Cancelar
      </button>
      <button class="btn-salvar" (click)="onSave()">
        Salvar
      </button>
    </div>
  </div>
</div>
