<main id="logged">
  <app-header (showOverlay)="onShowOverlay($event)"></app-header>

  <div class="content-wrapper">
    <app-sidebar></app-sidebar>

    <button
      class="mobile-backdrop"
      type="button"
      aria-label="Fechar menu"
      *ngIf="isMobile && sidebarStatus"
      (click)="fecharSidebarMobile()"
    ></button>

    <div class="main-content" [class.mobile-layout]="isMobile" [class.sidebar-open]="sidebarStatus"
      [class.sidebar-closed]="!sidebarStatus" (click)="fecharSidebarAoClicarConteudo()">
      <router-outlet></router-outlet>
    </div>
  </div>

  <button type="button" class="feedback-fab" [class.sidebar-open]="sidebarStatus && !isMobile"
    (click)="abrirFeedback()" title="Enviar feedback" aria-label="Enviar feedback">
    <span class="material-icons" aria-hidden="true">rate_review</span>
  </button>
</main>
