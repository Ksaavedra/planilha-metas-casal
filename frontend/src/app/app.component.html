<router-outlet></router-outlet>

<!-- Modal de Adicionar Meta - Renderizado no nível mais alto da aplicação -->
<app-adicionar-meta-modal [isOpen]="modalState.isOpen" [nome]="modalState.nome" [valorMetaRaw]="modalState.valorMetaRaw"
  [valorPorMesRaw]="modalState.valorPorMesRaw" [valorAtualRaw]="modalState.valorAtualRaw"
  [temValorAtual]="modalState.temValorAtual" [icon]="modalState.icon" (nomeChange)="onNomeChange($event)"
  (valorMetaChange)="onValorMetaChange($event)" (valorPorMesChange)="onValorPorMesChange($event)"
  (valorAtualChange)="onValorAtualChange($event)" (temValorAtualChange)="onTemValorAtualChange($event)"
  (iconChange)="onIconChange($event)" (valorMetaChangeEvent)="onValorMetaChangeEvent($event)"
  (valorPorMesChangeEvent)="onValorPorMesChangeEvent($event)" (valorAtualChangeEvent)="onValorAtualChangeEvent($event)"
  (save)="onSave()" (cancel)="onCancel()">
</app-adicionar-meta-modal>

<!-- Modal de Sucesso - Renderizado no nível mais alto da aplicação -->
<app-success-modal [isOpen]="sucessoState.isOpen" [title]="sucessoState.title" [message]="sucessoState.message"
  confirmText="Fechar" [autoCloseMs]="0" (close)="onCloseSucesso()">
</app-success-modal>

<!-- Modal de Confirmação de Exclusão - Renderizado no nível mais alto da aplicação -->
<app-confirm-modal [isOpen]="confirmarDeleteState.isOpen" title="Confirmar Exclusão"
  [message]="confirmarDeleteState.message" confirmText="Sim, Excluir" cancelText="Cancelar"
  (confirm)="onConfirmDelete()" (cancel)="onCancelDelete()">
</app-confirm-modal>

<!-- Modal de Sucesso de Exclusão - Renderizado no nível mais alto da aplicação -->
<app-success-modal [isOpen]="sucessoDeleteState.isOpen" title="Meta removida!"
  message="A meta foi excluída com sucesso." confirmText="OK" [autoCloseMs]="0" (close)="onCloseSucessoDelete()">
</app-success-modal>

<!-- Modal de Editar Valor - Renderizado no nível mais alto da aplicação -->
<app-editar-valor-modal [isOpen]="editarValorState.isOpen" [meta]="editarValorState.meta"
  [mesId]="editarValorState.mesId" [valor]="editarValorState.valor" [meses]="editarValorState.meses"
  (valorChange)="onValorChange($event)" (save)="onSaveEditarValor()" (cancel)="onCancelEditarValor()">
</app-editar-valor-modal>

<!-- Modal de Adicionar Receita - Renderizado no nível mais alto da aplicação -->
<app-adicionar-usuario-modal></app-adicionar-usuario-modal>

<!-- Modal Confirmar Exclusão de Receita -->
<app-confirm-modal [isOpen]="confirmarExcluirReceitaState.isOpen"
  title="Confirmar Exclusão" [message]="confirmarExcluirReceitaState.message"
  confirmText="Sim, Excluir" cancelText="Cancelar"
  (confirm)="onConfirmExcluirReceita()" (cancel)="onCancelExcluirReceita()">
</app-confirm-modal>

<!-- Modal Sucesso Exclusão de Receita -->
<app-success-modal [isOpen]="sucessoExcluirReceitaState.isOpen"
  title="Receita excluída!" message="A receita foi excluída com sucesso."
  confirmText="OK" [autoCloseMs]="0" (close)="onCloseSucessoExcluirReceita()">
</app-success-modal>

<!-- Modal Confirmar Exclusão de Receita -->
<app-confirm-modal [isOpen]="confirmarExcluirReceitaState.isOpen" title="Confirmar Exclusão"
  [message]="confirmarExcluirReceitaState.message" confirmText="Sim, Excluir" cancelText="Cancelar"
  (confirm)="onConfirmExcluirReceita()" (cancel)="onCancelExcluirReceita()">
</app-confirm-modal>

<!-- Modal Sucesso Exclusão de Receita -->
<app-success-modal [isOpen]="sucessoExcluirReceitaState.isOpen" title="Receita excluída!"
  message="A receita foi excluída com sucesso." confirmText="OK" [autoCloseMs]="0"
  (close)="onCloseSucessoExcluirReceita()">
</app-success-modal>
